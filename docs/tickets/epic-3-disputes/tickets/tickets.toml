[[entry]]
id = 8
type = "story"
title = "Dispute changes are recorded as stored events, and disputes load by replay"
description = "Every dispute change is a stored event in the dispute's own append-only stream in `StoredEvents` (ad-009). The `Dispute` aggregate appends the six stored event types (AD-13, AD-14a), `Dispute.Replay` rebuilds a dispute from its stream, and the one commit path (AD-14) writes the stored event, the `Disputes` read model row and, for a published type, the outbox row in one transaction, with no audit row. One exhaustive mapping in Infrastructure decides what is published. The customer timeline is built from the stored events through a deny-by-default allowlist, and the API contract does not change. `StoredEvents` is created by the migration that creates `Disputes`. Story 3.4 is the first handler that loads a dispute by replay to change it."
verify = "Domain unit tests, Testcontainers integration tests and the architecture tests pass; `dotnet ef migrations has-pending-model-changes` passes; `openapi.json` has no diff; raising for customer A writes one row each in `Disputes`, `StoredEvents` and `OutboxMessages` and no `AuditLogEntries` row."
covers = ["R10", "R15", "R16", "R17", "R18", "R23", "R28", "R29", "R31", "R35"]
after = [2]
hitl = false
risk = "high"
owner = "backend"
lane = "M2"
high_stakes = true
migration = true

[[entry]]
id = 4
type = "story"
title = "Customer withdraws an open dispute"
description = "Adds `Dispute.Withdraw` and `POST /api/v1/disputes/<disputeId>/withdraw`. The withdraw handler is the first to load a dispute by replaying its stored events and decide from that state (story 3.8, AD-13); on a version clash it reloads and decides once more (AD-15). A withdraw appends `DisputeWithdrawn`, published as `status-changed.v1` through story 3.8's mapping. Raise and withdraw refusals are audited as `Rejected` through `Audit.Record` (story 2.8, AD-14a)."
verify = "Domain unit tests for the withdraw cells and integration tests for withdraw, closed disputes, the version-clash reload, refusal audit entries and the event pass."

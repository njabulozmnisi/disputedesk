[[entry]]
id = 8
type = "story"
title = "Sign-in and sign-out are audited, and every endpoint is denied by default"
description = "Every sign-in and sign-out writes an audit entry (`SignIn`, `SignOut`) through one new Application method, `Audit.Record`, using the existing audit fields only (AD-14a, R41, NFR-SEC-10). Sign-out goes through the OpenID Connect handler's built-in `SignOutAsync` (AD-7). A deny-by-default fallback authorization policy requires an authenticated user on every endpoint that names no policy (AD-10). The security and error-shape tests also run under the Production environment. The whole-call deadline on core-banking calls is story 2.1's `TotalRequestTimeout` (AD-21), not this story's. No migration."
verify = "Integration tests for the sign-in and sign-out audit entries and their failure paths, the sign-in log capture, the end-session redirect and signed-out callback, the endpoint enumeration in each environment, the isolated fallback probe and the unmatched-route cases pass; the security and error-shape tests pass in both the Development and Production environments; `openapi.json` has no diff."
covers = ["R10", "R41", "R3", "R9", "R30", "R31", "R35"]
after = [2, 3]
hitl = false
risk = "high"
owner = "backend"
lane = "M1"
high_stakes = true

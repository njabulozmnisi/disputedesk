# Logins link to customers without revealing a match: stories in build order. Extra keys (owner, lane, high_stakes, migration, touches, supervisor_checks) are for the supervisor; tickets.py ignores them.

[[entry]]
id = 1
type = "story"
title = "Unlinked login starts linking with a uniform response and an OTP sent after the SIM-swap check"
description = "Adds `LinkingChallenges`, the `Unlinked` policy, `POST /api/v1/linking/start` and the background job (a `BackgroundService` reading a bounded `Channel`, the documented queued-background-task pattern) that matches, checks the link, runs the SIM-swap check, then claims, sends and releases the OTP on failure; adds `AuditLogEntries.ClientIp` (AD-12)."
verify = "Integration tests prove identical responses and writes, format errors, the linking-route states, the check order, fail-closed SIM swap, claim-send-release, supersession before and during a send, and every audited stop with its client IP; no ID number, full account number, cellphone or plaintext OTP appears in any table, log or span."
covers = ["R4", "R5", "R7", "R9", "R10", "R31", "R36"]
after = ["2.1", "2.3", "2.8", "3.2", "4.1"]
hitl = false
risk = "high"
refine = true
owner = "backend"
lane = "M2"
high_stakes = true
migration = true
touches = ["backend/src/DisputeDesk.Contracts/Linking/", "backend/src/DisputeDesk.Application/Linking/ (LinkingChallenge, job record, LinkingErrors)", "backend/src/DisputeDesk.Application/Linking/StartLinking/", "backend/src/DisputeDesk.Application/Audit/ (ClientIp)", "backend/src/DisputeDesk.Application/Abstractions/CustomerMatch.cs (sealed ToString)", "backend/src/DisputeDesk.Infrastructure/Linking/ (job, claim and release, channel, options, metrics, AddLinking)", "backend/src/DisputeDesk.Infrastructure/Persistence/ (LinkingChallenge configuration, UniqueViolations.cs, AuditLogEntryConfiguration.cs, Migrations/)", "backend/src/DisputeDesk.Api/Linking/", "backend/src/DisputeDesk.Api/Authorization/ (Unlinked policy, result handler)", "backend/src/DisputeDesk.Api/Program.cs", "docker-compose.yml (api service: Linking__OtpHmacKey dev value)", "backend/openapi.json", "frontend/src/api/generated/", "backend/tests/DisputeDesk.Api.IntegrationTests/Linking/ (with the port fakes)", "backend/tests/DisputeDesk.Api.IntegrationTests/Infrastructure/ApiFactory.cs", "backend/tests/DisputeDesk.Api.IntegrationTests/Authorization/EndpointAuthorizationTests.cs"]
supervisor_checks = ["Start linking with customer D's details through the gateway; the OTP lands in Mailpit and LinkingChallenges holds only its HMAC.", "Throwaway copy: move the SIM-swap call after the claim; criterion 4 fails.", "Throwaway copy: remove the release after an SMTP failure; criterion 5 fails.", "Throwaway copy: drop SupersededAtUtc IS NULL from the claim; criterion 6 fails.", "Throwaway copy: remove UQ_LinkingChallenges_LoginSub from UniqueViolations; criterion 1's parallel test gets a 500."]

[[entry]]
id = 5
type = "story"
title = "Linking start holds the send cap and a full queue"
description = "Adds the three-per-hour send cap to 6.1's job, counted, SIM-swap checked and claimed in one EF Core transaction under the two-key `pg_advisory_xact_lock` on the customer; every claim counts, delivered or not (the release keeps `OtpSentAtUtc`); an unexpected job exception audited; and the audited 429 on a full channel through a new `ErrorKind.RateLimited` (AD-3, AD-12)."
verify = "Integration tests prove every claim counting toward the cap, the one-hour edge, the cap across logins and IPs and under parallel starts, an audited stop on an unexpected job exception, the audited 429 on a full queue with no `Retry-After`, and the `LinkingOptions` bounds."
covers = ["R4", "R6", "R10", "R36"]
after = [1]
hitl = false
risk = "high"
refine = true
owner = "backend"
lane = "M2"
high_stakes = true
migration = false
touches = ["backend/src/DisputeDesk.Domain/ErrorKind.cs (RateLimited)", "backend/src/DisputeDesk.Api/Errors/ErrorResults.cs", "backend/src/DisputeDesk.Infrastructure/Linking/ (locked transaction, cap, OtpSends release, LinkingOptions bounds)", "backend/src/DisputeDesk.Application/Linking/LinkingChallenge.cs (doc), Linking/StartLinking/ (full-queue result)", "backend/src/DisputeDesk.Api/Linking/ (full-channel 429)", "docs/problems/rate-limited.md", "backend/openapi.json", "frontend/src/api/generated/", "backend/tests/DisputeDesk.Api.IntegrationTests/Linking/ (incl. LinkingOtpSendTests.cs)", "backend/tests/DisputeDesk.ArchitectureTests/ProblemCatalogueTests.cs"]
supervisor_checks = ["Throwaway copy: take the cap count outside the advisory-lock transaction; criterion 2 fails.", "Throwaway copy: make the release clear OtpSentAtUtc again; criterion 1 fails."]

[[entry]]
id = 2
type = "story"
title = "OTP verification links the login, with lockout and race safety"
description = "Adds `POST /api/v1/linking/verify`: one atomic conditional attempt update, a constant-time HMAC comparison on every attempt, consume and link in one EF Core transaction, keeping the session key (AD-12, AD-7). A correct third code links; lockout after three wrong codes; a login with no challenge row answers like a wrong code without counting."
verify = "Integration tests cover a correct code with the link and the session kept unchanged, the attempt sequence and lockout, every kind of challenge and a login with none, the input bounds, parallel verifications, two logins racing, and the audit entries, metrics and privacy."
covers = ["R5", "R7", "R10", "R31", "R36"]
after = [1]
hitl = false
risk = "high"
refine = true
owner = "backend"
lane = "M2"
high_stakes = true
migration = false
touches = ["backend/src/DisputeDesk.Contracts/Linking/ (verify request)", "backend/src/DisputeDesk.Application/Linking/VerifyOtp/", "backend/src/DisputeDesk.Application/Linking/LinkingErrors.cs", "backend/src/DisputeDesk.Infrastructure/Linking/ (attempt statement, consume, link insert)", "backend/src/DisputeDesk.Infrastructure/Persistence/ (UniqueViolations.cs, CustomerLinkConfiguration.cs)", "backend/src/DisputeDesk.Api/Linking/", "backend/src/DisputeDesk.Api/Program.cs", "backend/openapi.json", "frontend/src/api/generated/", "backend/tests/DisputeDesk.Api.IntegrationTests/Linking/", "backend/tests/DisputeDesk.Api.IntegrationTests/Authorization/EndpointAuthorizationTests.cs"]
supervisor_checks = ["Link customer D through the gateway with the OTP from Mailpit: Transactions loads without a new sign-in and the session cookie value is unchanged.", "Throwaway copy: remove the UQ_CustomerLinks_* entries from UniqueViolations; criterion 7 gets a 500.", "Throwaway copy: drop Attempts < 3 from the attempt statement; criteria 3 and 6 fail."]

[[entry]]
id = 6
type = "story"
title = "Trusted forwarded headers and an identity log without id_token_hint"
description = "Trusts forwarded headers only from the configured Compose network range through `ForwardedHeadersOptions.KnownIPNetworks`, with the subnet pinned in Compose and `ForwardedHeadersOptions.AllowedHosts` holding the public app host; and keeps `id_token_hint` out of the identity origin's access log (AD-20, AD-23). Split from 6.3 so it builds beside 6.5 and 6.2."
verify = "Integration tests prove forwarded headers are trusted only from the configured range, only the public app host is taken from `X-Forwarded-Host`, and the two keys are validated at start-up; architecture tests prove the pinned Compose subnet equals the configured range and the identity origin's log format."

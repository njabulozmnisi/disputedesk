[[entry]]
id = 3
type = "story"
title = "Linking rate limits per login and per IP"
description = "Adds the built-in sliding-window limiters, per client IP then per login, chained with `PartitionedRateLimiter.CreateChained` on the linking routes, with the shared 429 `rate-limited` body and `Retry-After`, and one audit entry per partition per window (AD-12, AD-23); proves the blank a full-queue 429 leaves verifies as a wrong code."
verify = "Integration tests prove both limits with their segment semantics and the chained edge, the 429 body and `Retry-After`, first-rejection audit and counted later rejections, the full-queue blank verifying as a wrong code, and the options' bounds; `openapi.json` changes only by the 429 responses on start and verify."
covers = ["R7", "R8", "R10"]
after = [5, 2]
hitl = false
risk = "high"
refine = true
owner = "backend"
lane = "M2"
high_stakes = true
migration = false
touches = ["backend/src/DisputeDesk.Api/Linking/RateLimiting/", "backend/src/DisputeDesk.Api/Linking/LinkingEndpoints.cs", "backend/src/DisputeDesk.Api/Program.cs (UseRateLimiter)", "backend/src/DisputeDesk.Api/appsettings.json", "README.md", "backend/openapi.json", "frontend/src/api/generated/", "backend/tests/DisputeDesk.Api.IntegrationTests/Linking/RateLimits/", "backend/tests/DisputeDesk.Api.IntegrationTests/Linking/ (full-queue blank in the verify blank-challenge tests)", "backend/tests/DisputeDesk.Api.IntegrationTests/Infrastructure/ApiFactory.cs (high limits)"]

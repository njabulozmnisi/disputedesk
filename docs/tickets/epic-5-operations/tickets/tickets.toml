[[entry]]
id = 5
type = "story"
title = "Scalar drives the operations API with a pasted bearer token behind a switch"
description = "Moves Scalar and the runtime OpenAPI document behind a bounded `Scalar:Enabled` (AD-26), declares one `bearer` security scheme on the operations routes only, and has the gateway forward `/scalar`, `/scalar/` and `/openapi/v1.json` to the Api with their own CSP: one fixed script hash for the page at `/scalar/`, and `style-src 'self' 'unsafe-inline'` for Scalar's runtime styles. Scalar holds no credential and leaks no configuration: a person pastes a token from `scripts/operations-token.sh`."
verify = "Integration tests cover the switch and its bounds, Scalar's served configuration, the page and the runtime document holding no configured value, the security scheme in the runtime and committed documents, and the served inline script's hash against the nginx template; the smoke check covers the gateway routes, the Scalar headers and a 429 on `/scalar/`; `openapi.json` changes only by the security scheme and requirements, and `frontend/src/api/generated/` matches it."
covers = ["R39", "R21"]
after = [1]
hitl = false
risk = "high"
owner = "backend"
lane = "M2"
high_stakes = true
migration = false

# Operations tools and the SLA sweep act on disputes: stories in build order. Extra keys (owner, lane, high_stakes, migration, touches, supervisor_checks) are for the supervisor; tickets.py ignores them.

[[entry]]
id = 1
type = "story"
title = "Operations tools authenticate with bearer tokens and read a dispute"
description = "Adds JwtBearer on the operations group (AD-8, AD-9), role policies, the actor mapping, `GET /api/v1/operations/disputes/<disputeId>` and Scalar behind `Scalar:Enabled`."
verify = "Integration tests with tokens signed by a test key cover credential pinning, roles, actor mapping and the read shape."
covers = ["R21", "R39"]
after = ["3.1", "2.5", "2.6"]
hitl = false
risk = "high"
owner = "backend"
lane = "B"
high_stakes = true
migration = false
touches = ["backend/src/DisputeDesk.Api/Operations/", "backend/src/DisputeDesk.Application/Operations/ReadDispute/", "backend/src/DisputeDesk.Api/Program.cs", "backend/src/DisputeDesk.Api/appsettings.json", "infra/zitadel/provision/provision.sh (Operations:Actors, dispute.read grant)", "infra/nginx/templates/ (Scalar CSP)", "backend/openapi.json", "backend/tests/DisputeDesk.Api.IntegrationTests/Operations/"]
supervisor_checks = ["From `/scalar/`, obtain a client-credentials token and read a seeded dispute."]

[[entry]]
id = 2
type = "story"
title = "Operations actions start review, escalate and resolve under the allowed-actions table"
description = "Adds `StartReview`, `Escalate` and `Resolve` to the aggregate with every FR-24 cell, the three action endpoints, audit of rejected actions and the status-changed events."
verify = "Domain unit tests cover every FR-24 cell; integration tests cover check order, races, audit and events."
covers = ["R20", "R21", "R23", "R10", "R36"]
after = [1, "3.4"]
hitl = false
risk = "high"
owner = "backend"
lane = "B"
high_stakes = true
migration = false
touches = ["backend/src/DisputeDesk.Domain/Disputes/Dispute.cs", "backend/src/DisputeDesk.Application/Operations/StartReview/, Escalate/, Resolve/", "backend/src/DisputeDesk.Api/Operations/", "backend/openapi.json", "backend/tests/ (Domain.Tests/Disputes/AllowedActions, Api.IntegrationTests/Operations/)"]
supervisor_checks = ["UJ-3 from Scalar: start review then resolve Upheld with \"We've reversed this debit.\"; customer A's timeline shows it."]

[[entry]]
id = 4
type = "story"
title = "Seeded disputes for customers A and B in every status"
description = "Extends `fixtures/local.json` and the seeder with disputes in every status and outcome, including the SLA demo dispute, changing each status only through the `Dispute` aggregate methods under a fixed seeding clock and writing no outbox rows (AD-13, AD-30)."
verify = "A seeder integration test on a fresh database finds every status and outcome for A, B's dispute, the SLA demo timing and zero outbox rows."
covers = ["R24"]
after = [2]
hitl = false
risk = "medium"
owner = "backend"
lane = "B"
high_stakes = true
migration = false
touches = ["fixtures/local.json (disputes)", "fixtures/README.md", "backend/src/DisputeDesk.Infrastructure/Seeding/", "backend/tests/DisputeDesk.Api.IntegrationTests/Seeding/"]
supervisor_checks = ["After `docker compose up`, the SLA demo dispute shows \"Under review (prioritised)\" about 5 minutes later once story 3 is merged."]

[[entry]]
id = 3
type = "story"
title = "SLA sweep escalates overdue disputes"
description = "Adds the Worker's SLA sweep (AD-18) through `Dispute.Escalate` as `automation`, with its heartbeat in the Worker health check."
verify = "Worker integration tests with a fake `TimeProvider` cover the 240-hour boundary, batching, two sweeps and catch-up."
covers = ["R22", "R26", "R27", "R18", "R23", "R36"]
after = [2, "4.1"]
hitl = false
risk = "high"
owner = "backend"
lane = "A"
high_stakes = false
migration = false
touches = ["backend/src/DisputeDesk.Worker/Sla/", "backend/src/DisputeDesk.Application/Sla/", "backend/src/DisputeDesk.Infrastructure/Sla/ (claim query)", "docker-compose.yml (worker health check adds the sweep file)", "backend/tests/DisputeDesk.Worker.IntegrationTests/Sla/"]
supervisor_checks = ["About 5 minutes after a fresh `docker compose up`, the seeded demo dispute shows \"Under review (prioritised)\" for customer A (UJ-4)."]

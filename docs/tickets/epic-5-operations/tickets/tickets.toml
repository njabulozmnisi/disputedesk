[[entry]]
id = 4
type = "story"
title = "Seeded disputes for customers A and B in every status"
description = "Extends `fixtures/local.json` and the seeder with disputes in every status and outcome, including the SLA demo dispute. The seeder calls the `Dispute` aggregate methods with back-dated instants and commits each seeded dispute's whole stream in one save through the full commit path, so each seeded action has one stored event and one outbox row (AD-13, AD-14, AD-30, ad-009). Per customer it reads each fixture dispute by `accountRef` + `transactionId` through the ownership filter on a second `AppDbContext` over the migrating connection, so a restart adds no rows; the relay publishes at least once and consumers deduplicate by CloudEvent `id` (AD-17)."
verify = "Seeder integration tests, each on its own empty database with a fixed clock, cover every status and outcome for A, B's dispute, the SLA demo timing, one stored event and one outbox row per seeded action, replay reproducing each seeded row, a second run, two instances, the synchronous path, seeding switched off, a downgrade, invalid fixture entries and privacy."
covers = ["R24", "R29"]
after = [2]
hitl = false
risk = "medium"
owner = "backend"
lane = "M2"
high_stakes = true
migration = false
touches = ["fixtures/local.json (disputes)", "fixtures/README.md", "backend/src/DisputeDesk.Infrastructure/Seeding/", "backend/tests/DisputeDesk.Api.IntegrationTests/Seeding/ (new), Transactions/SeededLinksTests.cs", "docker-compose.yml (Seed__Enabled comment)"]
supervisor_checks = ["On a fresh stack every seeded outbox row is `Sent` and the topic holds each of their `id`s; after `docker compose restart api` `OutboxMessages` has no new row and any repeated message carries an `id` already seen.", "After story 5.3 is merged, about 5 minutes after `docker compose up` the SLA demo dispute shows \"Under review (prioritised)\" for customer A.", "In a throwaway copy, seed without setting `CurrentCustomer` on the second context: the second-run case fails on `UQ_Disputes_AccountRef_TransactionId`."]

[[entry]]
id = 3

# Operations tools and the SLA sweep act on disputes: stories in build order. Extra keys (owner, lane, high_stakes, migration, touches, supervisor_checks) are for the supervisor; tickets.py ignores them.

[[entry]]
id = 1
type = "story"
title = "Operations tools authenticate with bearer tokens and read a dispute"
description = "Adds JwtBearer on the operations group (AD-8, AD-9), role policies, the actor mapping, `GET /api/v1/operations/disputes/<disputeId>` with every stored event type on its timeline and each read audited as `DisputeRead` through `AuditLog.Record`, and Scalar behind `Scalar:Enabled`."
verify = "Integration tests with tokens signed by a test key cover credential pinning, roles, actor mapping, the read shape with every stored event type, and the `DisputeRead` audit entry."
covers = ["R21", "R10", "R41", "R39"]
after = ["3.8", "2.8", "2.5", "2.6"]
hitl = false
risk = "high"
owner = "backend"
lane = "M2"
high_stakes = true
migration = false
touches = ["backend/src/DisputeDesk.Contracts/Audit/AuditAction.cs (DisputeRead)", "backend/src/DisputeDesk.Api/Operations/", "backend/src/DisputeDesk.Application/Operations/ReadDispute/", "backend/src/DisputeDesk.Api/Program.cs", "backend/src/DisputeDesk.Api/appsettings.json", "infra/zitadel/provision/provision.sh (Operations:Actors, dispute.read grant)", "infra/nginx/templates/ (Scalar CSP)", "backend/openapi.json", "backend/tests/DisputeDesk.Api.IntegrationTests/Operations/"]
supervisor_checks = ["From `/scalar/`, obtain a client-credentials token and read a dispute customer A raised through the customer API."]

[[entry]]
id = 2
type = "story"
title = "Operations actions start review, escalate and resolve under the allowed-actions table"
description = "Adds `StartReview`, `Escalate` and `Resolve` to the aggregate with every FR-24 cell, the three action endpoints that load a dispute by replay (AD-13), the version-clash reload (AD-15), audit of refused and forbidden actions, and the status-changed events."
verify = "Domain unit tests cover every FR-24 cell; integration tests cover check order, the version-clash reload, refusal audit and events."
covers = ["R20", "R21", "R23", "R10", "R29", "R36"]
after = [1, "3.4"]
hitl = false
risk = "high"
owner = "backend"
lane = "M2"
high_stakes = true
migration = false
touches = ["backend/src/DisputeDesk.Domain/Disputes/Dispute.cs", "backend/src/DisputeDesk.Application/Operations/StartReview/, Escalate/, Resolve/", "backend/src/DisputeDesk.Api/Operations/", "backend/openapi.json", "backend/tests/ (Domain.Tests/Disputes/AllowedActions, Api.IntegrationTests/Operations/)"]
supervisor_checks = ["UJ-3 from Scalar: start review then resolve Upheld with \"We've reversed this debit.\"; customer A's timeline shows it."]

[[entry]]
id = 4
type = "story"
title = "Seeded disputes for customers A and B in every status"
description = "Extends `fixtures/local.json` and the seeder with disputes in every status and outcome, including the SLA demo dispute. The seeder calls the `Dispute` aggregate methods with back-dated instants resolved from the fixture, and every seeded dispute goes through the full commit path, so it gets its stored events and outbox rows like any other dispute and is published once per fresh database (AD-13, AD-14, AD-30, ad-009)."
verify = "A seeder integration test on a fresh database finds every status and outcome for A, B's dispute, the SLA demo timing, one stored event per seeded action, one outbox row per published seeded change, replay reproducing each seeded row, and nothing written by a second run."
covers = ["R24", "R29"]
after = [2]
hitl = false
risk = "medium"
owner = "backend"
lane = "M2"
high_stakes = true
migration = false
touches = ["fixtures/local.json (disputes)", "fixtures/README.md", "backend/src/DisputeDesk.Infrastructure/Seeding/", "backend/tests/DisputeDesk.Api.IntegrationTests/Seeding/"]
supervisor_checks = ["After `docker compose up`, the SLA demo dispute shows \"Under review (prioritised)\" about 5 minutes later once story 3 is merged."]

[[entry]]
id = 3
type = "story"
title = "SLA sweep escalates overdue disputes"
description = "Adds the Worker's SLA sweep (AD-18): it loads each claimed dispute by replay and escalates it through `Dispute.Escalate` as `automation`, and before the SLA is due records `SlaWarningRaised` once per dispute through `Dispute.RecordSlaWarning`, with its heartbeat in the Worker health check."
verify = "Worker integration tests with a fake `TimeProvider` cover the 240-hour boundary, the SLA warning, batching, two sweeps and catch-up."
covers = ["R22", "R26", "R27", "R18", "R23", "R29", "R36"]
after = [2, "4.1"]
hitl = false
risk = "high"
unknown = "the SLA warning lead time is an open decision for the human, settled when this story is readied; not ready to build until then."
owner = "backend"
lane = "M2"
high_stakes = true
migration = true
touches = ["backend/src/DisputeDesk.Domain/Disputes/Dispute.cs (RecordSlaWarning, its Apply case)", "backend/src/DisputeDesk.Infrastructure/Persistence/ (SlaWarningRaisedAtUtc, Migrations/)", "backend/src/DisputeDesk.Worker/Sla/", "backend/src/DisputeDesk.Application/Sla/", "backend/src/DisputeDesk.Infrastructure/Sla/ (claim query)", "docker-compose.yml (worker health check adds the sweep file)", "backend/tests/DisputeDesk.Worker.IntegrationTests/Sla/"]
supervisor_checks = ["About 5 minutes after a fresh `docker compose up`, the seeded demo dispute shows \"Under review (prioritised)\" for customer A (UJ-4)."]

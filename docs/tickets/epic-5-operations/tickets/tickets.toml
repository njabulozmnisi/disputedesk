# Operations tools and the SLA sweep act on disputes: stories in build order. Extra keys (owner, lane, high_stakes, migration, touches, supervisor_checks) are for the supervisor; tickets.py ignores them.

[[entry]]
id = 1
type = "story"
title = "Operations tools authenticate with bearer tokens and read a dispute"
description = "Adds JwtBearer on the operations group (AD-8, AD-9) with the `dispute.read` policy and the actor mapping, `GET /api/v1/operations/disputes/<disputeId>` with every stored event type on its timeline, each read audited as `DisputeRead` through `AuditLog.Record`, the provisioned actor mapping and a script that gets an operations token by client credentials."
verify = "Integration tests with tokens signed by a test key cover credential pinning on every endpoint, token validation, roles and actor mapping, the read shape with every stored event type, privacy, and the `DisputeRead` audit entries; the architecture and platform-script tests pass."
covers = ["R21", "R10", "R41"]
after = ["3.8", "3.3", "2.8", "2.5", "2.6"]
hitl = false
risk = "high"
owner = "backend"
lane = "M2"
high_stakes = true
migration = false
touches = ["backend/Directory.Packages.props, backend/src/DisputeDesk.Api/DisputeDesk.Api.csproj (JwtBearer 10.0.14)", "backend/src/DisputeDesk.Contracts/Audit/AuditAction.cs (DisputeRead)", "backend/src/DisputeDesk.Contracts/Operations/", "backend/src/DisputeDesk.Api/Operations/", "backend/src/DisputeDesk.Api/Bff/ZitadelOptions.cs (ProjectId)", "backend/src/DisputeDesk.Api/Program.cs", "backend/src/DisputeDesk.Application/Abstractions/CurrentOperationsActor.cs", "backend/src/DisputeDesk.Application/Operations/ReadDispute/", "infra/zitadel/provision/provision.sh (Operations:Actors)", "scripts/operations-token.sh (new)", "backend/openapi.json, frontend/src/api/generated/", "backend/tests/DisputeDesk.Api.IntegrationTests/ (Operations/, Authorization/EndpointAuthorizationTests.cs, Infrastructure/FakeZitadel.cs, Infrastructure/ApiFactory.cs)", "backend/tests/DisputeDesk.ArchitectureTests/ (OwnershipRulesTests.cs, PlatformScriptTests.cs)"]

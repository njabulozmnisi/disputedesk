# DisputeDesk gateway: the single entry point of the local platform.
#   http://localhost:8080       app origin: placeholder page now, the frontend later; /api/ -> api
#   http://auth.localhost:8080  identity origin: Zitadel API, console and Login v2 (/ui/v2/login)
# nginx listens on 8080 inside the container too and carries the network alias auth.localhost,
# so the issuer URL is identical for browsers (front channel) and containers (back channel).
#
# This is the edge: upstreams get a fixed Host for their origin (never the client's raw Host, which only
# has to match server_name, port aside) and X-Forwarded-For is the peer address, not a client-supplied chain.
user nginx;
worker_processes 1;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  access_log    /var/log/nginx/access.log;

  upstream api           { server api:8080;           keepalive 16; }
  upstream zitadel_api   { server zitadel:8080;       keepalive 16; }
  upstream zitadel_login { server zitadel-login:3000; keepalive 16; }

  # ---------------------------------------------------------------------------------------------
  # App origin
  # ---------------------------------------------------------------------------------------------
  server {
    listen 8080 default_server;
    server_name localhost;

    # Every response on this origin, including proxied API responses. Plain HTTP locally, so no HSTS.
    # form-action allows the identity origin because the sign-in redirect chain ends there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://auth.localhost:8080" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    root /usr/share/nginx/html;
    location / { try_files $uri /index.html; }

    # The api keeps its health endpoints at the root (/health/*); expose them under /api/health/*.
    location /api/health/ {
      proxy_pass http://api/health/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host localhost:8080;
      proxy_set_header X-Forwarded-Host localhost:8080;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Everything else under /api/ keeps its path: the api serves /api/v1/... itself.
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host localhost:8080;
      proxy_set_header X-Forwarded-Host localhost:8080;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }

  # ---------------------------------------------------------------------------------------------
  # Identity origin: Zitadel API and Login v2 on one host (a separate login origin fights the
  # login's own CSP, see the Zitadel lab notes). Zitadel resolves its instance from the Host,
  # which must be exactly ExternalDomain:ExternalPort.
  # ---------------------------------------------------------------------------------------------
  server {
    listen 8080;
    server_name auth.localhost;

    location /ui/v2/login {
      proxy_pass http://zitadel_login;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host auth.localhost:8080;
      proxy_set_header X-Forwarded-Host auth.localhost:8080;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = / { return 302 /ui/v2/login/; }

    # OIDC, REST, Connect (HTTP/1.1), console and assets.
    location / {
      proxy_pass http://zitadel_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host auth.localhost:8080;
      proxy_set_header X-Forwarded-Host auth.localhost:8080;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
    }
  }
}

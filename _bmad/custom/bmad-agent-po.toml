[agent]
persistent_facts = ["Planning docs live at: docs/product-brief/product-brief.md, docs/prd/prd.md, docs/ux/ (ux.md, DESIGN.md, EXPERIENCE.md), docs/architecture/architecture.md, docs/research/<topic>/<topic>.md, docs/initiative-disputedesk.md, docs/tickets/ and docs/backlog/. Read inputs from these paths when no ticket lists them. Name these exact paths in sources: and companions:.",
  "New work is a feature spec (AGENTS.md, Ticket numbering): a BMAD backlog story, `docs/backlog/story-<id>.md`, where `<id>` is the feature slug; no epic folder and no number in the name. Its front matter keys are exactly `id` (the backlog's `next_id` from `tickets.py status docs/backlog`), `type: story`, `title`, `sources`, `companions`, `after` (each entry a sibling's stem, `story-<id>`), `refined`, `hitl`, `risk`, and `decisions` only when the pre-build review has a `[decision]` point; no `parent`, `covers`, `tracker_id` or `assignee`. No slug equals another slug followed by `-` and more characters. The numbered epics and stories under docs/tickets/ are done; never renumber or rename them.",
  "docs/tickets/README.md is the build-order index a human reads: the done epics and stories with their numbers, then the `## Features` table, header row `| Slug | Title | Owner | Tier | Status |`, one row per feature spec in build order (the bare slug, the title linking the spec, status last; scripts/check-ready.sh reads that row). Update it in the same change whenever a feature spec is added, moved, renamed or dropped.",
  "A story with `[decision]` points carries `decisions: pending` in its front matter; only the supervisor changes it to exactly `decisions: settled`, once the human has answered every point and the answer is recorded (scripts/check-ready.sh reads this field)."]

[workflow]
tickets_refactor_sweep = """
Do not add a per-epic refactor sweep. The project closes with one sequential refactor-sweep story after all epics.\
"""
tickets_story_count = """
No target story count. Cut the thinnest vertical slices that meet the criteria; offer a split only when an epic stops being one outcome.\
"""

# DisputeDesk local platform. `docker compose up --wait` brings everything up configured, zero clicks.
#   http://localhost:8080                 gateway: app origin (the SPA, /api/ and /scalar/ -> api, /otlp/v1/* -> Aspire)
#   http://auth.localhost:8080            gateway: Zitadel API, console and the hosted login
#   http://localhost:8025                 Mailpit (verification and reset emails)
#   http://localhost:18888                Aspire dashboard (traces, metrics, logs)
#   http://localhost:8081                 Redpanda Console, only when asked (profile `console`, local only):
#                                         docker compose --profile console up -d --wait redpanda-console
#   127.0.0.1:5433 / :19092 / :4317       Postgres, Redpanda and OTLP for apps run on the host
#
# Host ports that clash with a process already listening can be moved, from the shell or an untracked .env:
#   POSTGRES_HOST_PORT (5433), DISPUTEDESK_REDPANDA_PORT (19092), DISPUTEDESK_MAILPIT_PORT (8025),
#   DISPUTEDESK_DASHBOARD_PORT (18888), DISPUTEDESK_OTLP_GRPC_PORT (4317), DISPUTEDESK_OTLP_HTTP_PORT (4318),
#   DISPUTEDESK_CONSOLE_PORT (8081).
# The default network's subnet moves the same way when a second stack runs beside this one (another worktree or
# a throwaway copy): DISPUTEDESK_SUBNET (10.201.89.0/24), for example 10.201.90.0/24. The api trusts forwarded
# headers from that same subnet.
# The gateway's 8080 stays fixed (see the gateway service). infra/tests/smoke.sh reads the same variables, from the
# shell only, so export them there rather than in .env when running it.
#
# Every credential below is a fixed DEV-ONLY value, overridable from an untracked .env file.
# Generated client IDs and secrets never touch the repo: the provisioner, in the zitadel container, writes them to
# the `zitadel-clients` volume (see infra/README.md).
# Images are pinned by tag and by multi-arch index digest.
name: disputedesk

x-app-config: &app-config
  ConnectionStrings__DisputeDesk: Host=postgres;Port=5432;Database=disputedesk;Username=disputedesk;Password=${APP_DB_PASSWORD:-dev-only-app-db}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-only-app-db}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:-dev-only-zitadel-db}
      QA_DB_PASSWORD: ${QA_DB_PASSWORD:-dev-only-qa-db}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql                 # PG18 keeps its data under /var/lib/postgresql/18/docker
      - ./infra/images/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: the init-time server is socket-only, so a socket check goes healthy before the roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 320m

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6@sha256:8b1076e0d61bfceb66594dc01536427ce0b529f8ead35fdab9763ab6085891ce
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=192M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Clients on the host are told to reconnect to the advertised address, so it follows the host port.
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${DISPUTEDESK_REDPANDA_PORT:-19092}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    ports: ["127.0.0.1:${DISPUTEDESK_REDPANDA_PORT:-19092}:19092"]
    volumes: ["redpanda:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Peak 253.3 MiB × 1.5, rounded up to 64 MiB. The peak is docker stats' highest sample in the run of 2026-11-06,
    # taken in the first seconds after start; that run includes the broker stop-and-restart test.
    mem_limit: 384m

  # Optional and local only: started only with the `console` profile, so a plain `up` and the AWS deploy never run it
  # (ComposeRenderTests in infra/tests). No sign-in: it is published on loopback only.
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.13.1@sha256:d72608f64c65a5631adca6c99b44d157cefb9edb0473ed58451f91affcfcfa1b
    profiles: [console]
    restart: unless-stopped                        # runs as the image's non-root user (redpandaconsole)
    environment:
      KAFKA_BROKERS: redpanda:9092                 # Console's kafka.brokers setting
    ports: ["127.0.0.1:${DISPUTEDESK_CONSOLE_PORT:-8081}:8080"]
    healthcheck:
      # The probe Redpanda's own Console Helm chart uses.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/admin/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      redpanda: { condition: service_healthy }
    mem_limit: 128m                                # idle near 50 MiB (docker stats, 2026-11-02)

  # Zitadel plus its provisioner (infra/images/zitadel): the post_start hook below creates the project, roles, web app,
  # operations machine user and fixture logins. Everything runs as the image's non-root zitadel user.
  zitadel:
    image: disputedesk-zitadel:local
    build: ./infra/images/zitadel
    restart: unless-stopped
    command: start-from-init --masterkeyFromEnv
    environment:
      ZITADEL_EXTERNALDOMAIN: auth.localhost
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}   # true behind HTTPS in AWS (AD-24)
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-DevOnlyMasterKeyNotForProduction}   # exactly 32 characters
      ZITADEL_PORT: "8080"
      ZITADEL_TLS_ENABLED: "false"
      GOMEMLIMIT: 600MiB
      # Its own database and non-superuser role on the shared server; no admin credentials.
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${ZITADEL_DB_PASSWORD:-dev-only-zitadel-db}@postgres:5432/zitadel?sslmode=disable

      # FirstInstance: runs once, on an empty database.
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: DisputeDesk
      ZITADEL_FIRSTINSTANCE_ORG_NAME: DisputeDesk
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Dispute
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: admin@disputedesk.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Dev-Only-Admin-1}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # IAM_OWNER machine user whose PAT only the provisioner reads (zitadel-bootstrap volume).
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Provisioner (IAM_OWNER)
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat

      # DefaultInstance: instance defaults applied when the instance is created. The login policy defaults
      # already allow self-registration, leave MFA optional and allow TOTP, so they are not restated here.
      # Zitadel's own login at /ui/login, which also enforces email verification before a sign-in completes.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # No public organization registration (/ui/login/register/org answers 404); customers still sign up inside the
      # DisputeDesk organization. provision.sh closes it on an instance made before this setting.
      ZITADEL_DEFAULTINSTANCE_RESTRICTIONS_DISALLOWPUBLICORGREGISTRATION: "true"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@disputedesk.test
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: DisputeDesk

      # The provisioner's settings (provision.sh, verify.sh). It calls this container at 127.0.0.1:8080 with the
      # public host in the Host header, and takes the issuer from Zitadel's discovery document.
      PROVISION_CALL_URL: http://auth.localhost:8080
      PROVISION_CONNECT_TO: auth.localhost:8080:127.0.0.1:8080
      PROVISION_PAT_FILE: /zitadel/bootstrap/admin.pat
      PROVISION_OUT_DIR: /provision/out
      PROVISION_FIXTURES_FILE: /fixtures/local.json
      PROVISION_MARKER_FILE: /provision/state/provisioned   # in the container, not a volume: a recreate removes it
      PROVISION_APP_ORIGINS: http://localhost:8080 http://localhost:5101 http://localhost:5102
      PROVISION_AUTH_DEVELOPMENT_MODE: ${AUTH_DEVELOPMENT_MODE:-true}   # allows the plain-http origins; false in AWS (AD-24)
      PROVISION_DEACTIVATE_HUMAN_ADMINS: "false"   # the console admin above stays usable locally; true in AWS
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
      - zitadel-clients:/provision/out
      - ./backend/fixtures/local.json:/fixtures/local.json:ro
      # The hosted login's branding sources (story 2.6), one file each, never the whole frontend/ directory.
      - ./frontend/src/theme/tokens.css:/brand/tokens.css:ro
      - ./frontend/src/theme/fonts/nunito-sans-latin-400-normal.woff2:/brand/nunito-sans-latin-400-normal.woff2:ro
      - ./frontend/src/theme/wordmark.png:/brand/wordmark.png:ro
      - ./frontend/src/theme/wordmark-dark.png:/brand/wordmark-dark.png:ro
    # Compose runs the hook in this container right after it starts, and every service that depends on zitadel waits
    # for it to end (Compose, "Lifecycle hooks"). A failed hook fails `up`.
    post_start:
      - command: ["bash", "/provision/provision.sh"]
        user: zitadel
    # Healthy only once this container's provisioning succeeded, so a failed hook keeps the api from ever starting.
    # retries covers the hook's 300 s readiness deadline plus its run.
    healthcheck:
      test: ["CMD-SHELL", "test -f /provision/state/provisioned && zitadel ready"]
      interval: 10s
      timeout: 30s
      retries: 36
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 448m                                # session peak 275.0 MiB × 1.5, rounded up to 64 MiB (docker stats, 2026-11-06)

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: unless-stopped
    ports: ["127.0.0.1:${DISPUTEDESK_MAILPIT_PORT:-8025}:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 128m

  core-banking:   # stand-in for the bank's core banking and the SIM-swap check (AD-21); internal only, no host port
    image: disputedesk-core-banking:local
    build: { context: ./backend, target: core-banking }
    restart: unless-stopped                        # runs as the image's non-root `app` user
    init: true   # as PID 1, dotnet never gets the SIGABRT of its own crash (pid_namespaces(7)) and spins instead of exiting
    environment:
      FixturesPath: /fixtures/local.json
    volumes:
      - ./backend/fixtures/local.json:/fixtures/local.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 192m

  api:
    image: disputedesk-api-local:local
    build: { context: ./backend, target: api-local }   # the api image plus busybox for the readiness and heartbeat checks
    restart: unless-stopped
    init: true   # as PID 1, dotnet never gets the SIGABRT of its own crash (pid_namespaces(7)) and spins instead of exiting
    environment:
      <<: *app-config
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: disputedesk-api
      # Local plain-http values (AD-24); appsettings.json holds the AWS ones (__Host- names, Secure always).
      Authentication__SessionCookie__Name: disputedesk-session
      Authentication__AntiforgeryCookie__Name: disputedesk-antiforgery
      Authentication__CorrelationCookie__Name: disputedesk-correlation.
      Authentication__NonceCookie__Name: disputedesk-nonce.
      Authentication__Cookie__SecurePolicy: SameAsRequest
      Zitadel__RequireHttpsMetadata: "false"       # the local issuer is http://auth.localhost:8080
      CoreBanking__BaseUrl: http://core-banking:8080
      Sms__Host: mailpit                           # every SMS lands in the Mailpit inbox
      Sms__Port: "1025"
      Sms__UseTls: "false"                         # Mailpit accepts plain SMTP only
      Seed__Enabled: "true"                        # links A and B to their fixture logins and seeds their disputes (AD-30)
      Seed__FixturesPath: /fixtures/local.json
      Scalar__Enabled: "true"                      # Scalar at /scalar/ and the runtime document (AD-26)
      # The OTP HMAC key (AD-26): base64 of the text "dev-only-linking-otp-hmac-key-not-a-secret", 42 bytes.
      Linking__OtpHmacKey: ${LINKING_OTP_HMAC_KEY:-ZGV2LW9ubHktbGlua2luZy1vdHAtaG1hYy1rZXktbm90LWEtc2VjcmV0}
      # AD-23: only the default network (pinned below) may forward headers, and only for the public app host.
      ForwardedHeaders__TrustedNetwork: ${DISPUTEDESK_SUBNET:-10.201.89.0/24}
      ForwardedHeaders__AllowedHosts: localhost
      # Locally the api also runs the outbox relay and the SLA sweep, so there is no worker container; in AWS the
      # worker runs them (infra/deploy/aws/compose.yml).
      Worker__InProcess: "true"
      Kafka__BootstrapServers: redpanda:9092
    volumes:
      - zitadel-clients:/run/zitadel:ro            # zitadel-clients.json (the Zitadel:* keys, client IDs and secrets)
      - ./backend/fixtures/local.json:/fixtures/local.json:ro   # the seed source, the same file the stub reads
    # Zitadel's group (gid 1000): the provisioner writes zitadel-clients.json as its user, readable by owner and group.
    group_add: ["1000"]
    # AD-25: the relay touches its file every loop (at least every 10 s); older than 30 s means a hung relay. The SLA
    # sweep touches its own every 30-second loop and after each batch; older than 90 s (three missed loops) means a
    # hung sweep. Both write under the system temporary directory, so the api must not set TMPDIR.
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "sh", "-c",
             "now=$$(/usr/local/bin/busybox date +%s) && test $$(( now - $$(/usr/local/bin/busybox stat -c %Y /tmp/heartbeat-relay) )) -le 30 && test $$(( now - $$(/usr/local/bin/busybox stat -c %Y /tmp/heartbeat-sweep) )) -le 90 && /usr/local/bin/busybox wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      zitadel: { condition: service_healthy }      # healthy only once provisioning wrote zitadel-clients.json
      core-banking: { condition: service_healthy }
      # The issuer's auth.localhost must reach the gateway's alias from the api's first lookup. Before the alias
      # exists, Docker's DNS passes the name to the host's resolver, which may answer loopback for *.localhost
      # (RFC 6761), and the api would fetch the discovery document from itself. The alias exists once the gateway
      # has started; waiting for healthy would deadlock, because the gateway is healthy only once it reaches the api.
      gateway: { condition: service_started }
    # Longer than the host's 30-second ShutdownTimeout, so an in-flight request or linking job can finish (AD-25).
    stop_grace_period: 35s
    mem_limit: 320m

  # No health check: the image is chiseled (no shell, no HTTP client), so the gateway waits only for it to start.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1@sha256:03099004e132a7ca2feb66c5fa24715ffeaaf2fffab6f8b2cda23de3abd3ea45
    restart: unless-stopped                        # runs as the image's non-root app user
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"   # dev only: no sign-in for the UI or OTLP
    ports:
      - "127.0.0.1:${DISPUTEDESK_DASHBOARD_PORT:-18888}:18888"   # UI, loopback only
      - "127.0.0.1:${DISPUTEDESK_OTLP_GRPC_PORT:-4317}:18889"    # OTLP/gRPC for apps run on the host
      - "127.0.0.1:${DISPUTEDESK_OTLP_HTTP_PORT:-4318}:18890"    # OTLP/HTTP for apps run on the host
    mem_limit: 384m

  # Build-only: the built SPA files (frontend/Dockerfile, at /dist/) that the gateway image copies in. The profile
  # keeps it from ever getting a container; `up --build` still builds it, because the gateway's build names it
  # (Compose, additional_contexts "service:"). ComposeRenderTests (infra/tests) checks that it stays behind the profile.
  spa:
    image: disputedesk-spa:local
    build: ./frontend
    profiles: [build]

  gateway:   # the SPA and the edge rules; runs as the image's non-root nginx user (infra/images/gateway/Dockerfile)
    image: disputedesk-gateway:local
    build:
      context: ./infra/images/gateway
      additional_contexts: { spa: "service:spa" }   # the built SPA files, not the frontend source (ad-011)
    restart: unless-stopped
    # Fixed on purpose (AD-24 keeps the zero-click http://localhost:8080 and http://auth.localhost:8080): 8080 is
    # also baked into Zitadel's issuer, the sign-in redirect URIs and the GATEWAY_* and provisioner Host headers, and
    # containers reach the issuer through this gateway's network alias on its container port.
    ports: ["127.0.0.1:8080:8080"]
    environment:
      # Rendered into the nginx templates at start (infra/images/gateway/templates). Hosts are Host header values (with
      # the port); the server name is the identity host as nginx matches it (without the port).
      GATEWAY_APP_HOST: localhost:8080
      GATEWAY_AUTH_HOST: auth.localhost:8080
      GATEWAY_AUTH_SERVER_NAME: auth.localhost
      GATEWAY_AUTH_ORIGIN: http://auth.localhost:8080              # the CSP form-action origin
      GATEWAY_HSTS: ""                                             # plain HTTP locally; set behind HTTPS in AWS
      GATEWAY_OTLP_ENDPOINT: http://aspire-dashboard:18890         # the dashboard's OTLP/HTTP receiver
    networks:
      default:
        aliases: ["auth.localhost"]                # containers reach the issuer at the same URL as browsers
    # Healthy only when all three routes answer: the identity origin, the SPA and the api. nginx looks the api up again
    # only after a failed lookup's retry delay (10 s for "no such name", 30 s for a resolver error such as CI's), so
    # /api/ can answer 502 for that long after the api starts; `up --wait` returns only once /api/ works.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header 'Host: auth.localhost:8080' http://127.0.0.1:8080/debug/healthz >/dev/null && wget -qO- http://127.0.0.1:8080/ >/dev/null && wget -qO- http://127.0.0.1:8080/api/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      # nginx resolves these upstreams at start, so they must exist. It finds the api at run time instead, because
      # the api starts after this gateway (see the api's depends_on).
      zitadel: { condition: service_healthy }
      aspire-dashboard: { condition: service_started }
    mem_limit: 128m

# AD-23: the Api trusts forwarded headers from this subnet (ForwardedHeaders__TrustedNetwork above), so it is pinned
# rather than picked by Docker. It sits outside Docker's default address pools; DISPUTEDESK_SUBNET moves it (header).
networks:
  default:
    ipam:
      config:
        - subnet: ${DISPUTEDESK_SUBNET:-10.201.89.0/24}

volumes:
  pgdata:
  redpanda:
  zitadel-bootstrap:                               # IAM_OWNER PAT: written by FirstInstance, read by the provisioner
  zitadel-clients:                                 # zitadel-clients.json: zitadel writes, the api reads

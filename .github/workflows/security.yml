# security-passed fails unless every job here succeeded; it and ci.yml's ci-passed become the two required checks in
# main's ruleset (story 9.3), beside the CodeQL code-scanning rule.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so advisories published after a merge still surface when the code has not changed.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes and schedules have no head_ref, so each run gets
# its own group (the run ID) and every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Gitleaks is downloaded from its GitHub release and checked against a SHA-256 pinned here, the same idea as pinning
# actions to a commit SHA: a re-tagged or replaced release fails the check. Trivy's pin lives in
# .github/actions/install-trivy/install.sh, which this workflow and ci.yml's publish job share.
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSL --max-time 300 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Same tool and config as the pre-commit hook. --redact keeps secret values out of the log.
      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

  # One job per language: build-mode applies to a single language per job, so CodeQL's documented form is a matrix.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build mode none still restores NuGet packages, which needs the SDK that global.json pins.
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      # Build mode none analyses the source without compiling it: GitHub's default for C#, and the only mode for
      # JavaScript and TypeScript (frontend/ and e2e/).
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  vulnerable-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      # NuGetAudit is the gate: restore fails on a High or Critical advisory, direct or transitive (Directory.Build.props).
      - run: dotnet restore DisputeDesk.slnx

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TRIVY_NO_PROGRESS: "true" # no download progress bars in the log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-trivy

      # Vulnerable dependencies and misconfiguration (the Dockerfiles) in the repo. Secrets are gitleaks' job.
      # Accepted findings are triaged, one path each, in .github/trivyignore.yaml. The command is the one builders run
      # locally before merge, so the two scans cannot drift apart.
      - name: Filesystem and config scan
        run: scripts/security-local.sh

      # The five images ci.yml's publish job pushes, from the same targets (api-local and worker-local, P57).
      # The gateway takes the built SPA files from the SPA image through the named context spa (ad-011); the SPA
      # image is not scanned on its own, its files are scanned inside the gateway. docker-image:// of the local,
      # never-pushed tag works because the default docker driver reads the daemon's image store; a docker-container
      # builder (for example from setup-buildx-action) would try a registry pull instead.
      - name: Build the api, worker, core-banking, gateway and provision images
        run: |
          docker build -t disputedesk-api:ci --target api-local backend
          docker build -t disputedesk-worker:ci --target worker-local backend
          docker build -t disputedesk-core-banking:ci --target core-banking backend
          docker build -t disputedesk-spa:ci frontend
          docker build -t disputedesk-gateway:ci --build-context spa=docker-image://disputedesk-spa:ci infra/nginx
          docker build -t disputedesk-provision:ci infra/zitadel/provision

      - name: Image scan
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 disputedesk-api:ci
          trivy image --severity HIGH,CRITICAL --exit-code 1 disputedesk-worker:ci
          trivy image --severity HIGH,CRITICAL --exit-code 1 disputedesk-core-banking:ci
          trivy image --severity HIGH,CRITICAL --exit-code 1 disputedesk-gateway:ci
          trivy image --severity HIGH,CRITICAL --exit-code 1 disputedesk-provision:ci

  # ad-012 clause 3: the Security required check (story 9.3), the same rule as ci.yml's ci-passed. A skipped job reports
  # success to a required check, so this job reads each needed job's result and passes only when every one is success;
  # always() runs it even when the run is cancelled. For the codeql matrix, needs.codeql.result is the legs' combined
  # result; GitHub Docs do not say how legs combine, so story 9.1's Supervisor checks prove one failing leg fails it.
  security-passed:
    needs: [gitleaks, codeql, vulnerable-packages, trivy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every security job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_passed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [[ -n "$not_passed" ]]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$not_passed"
            exit 1
          fi
          echo "Every check job succeeded."

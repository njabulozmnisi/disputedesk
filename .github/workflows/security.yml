# These jobs and the CodeQL code-scanning result block a merge only once they are required checks in the branch ruleset.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so advisories published after a merge still surface when the code has not changed.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes and schedules have no head_ref, so each run gets
# its own group (the run ID) and every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Gitleaks and Trivy are downloaded from their GitHub releases and checked against a SHA-256 pinned here,
# the same idea as pinning actions to a commit SHA: a re-tagged or replaced release fails the check.
# (The trivy-action and setup-trivy tags were force-pushed with malicious code in March 2026.)
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Same tool and config as the pre-commit hook. --redact keeps secret values out of the log.
      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

  # One job per language: build-mode applies to a single language per job, so CodeQL's documented form is a matrix.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build mode none still restores NuGet packages, which needs the SDK that global.json pins.
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      # Build mode none analyses the source without compiling it: GitHub's default for C#, and the only mode for
      # JavaScript and TypeScript (frontend/ and e2e/).
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  vulnerable-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      # NuGetAudit is the gate: restore fails on a High or Critical advisory, direct or transitive (Directory.Build.props).
      - run: dotnet restore DisputeDesk.slnx

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TRIVY_NO_PROGRESS: "true" # no download progress bars in the log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Vulnerable dependencies and misconfiguration (the Dockerfiles) in the repo. Secrets are gitleaks' job.
      # Accepted findings are triaged, one path each, in .github/trivyignore.yaml.
      - name: Filesystem and config scan
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --ignorefile .github/trivyignore.yaml .

      # The gateway builds from the repository root, so its one build reads frontend/ and infra/nginx/.
      - name: Build the api, worker and gateway images
        run: |
          docker build -t disputedesk-api:ci backend
          docker build -t disputedesk-worker:ci --target worker backend
          docker build -t disputedesk-gateway:ci -f infra/nginx/Dockerfile .

      - name: Image scan
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 disputedesk-api:ci
          trivy image --severity HIGH,CRITICAL --exit-code 1 disputedesk-worker:ci
          trivy image --severity HIGH,CRITICAL --exit-code 1 disputedesk-gateway:ci

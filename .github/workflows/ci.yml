name: CI

on:
  pull_request:
  push:
    branches: [main, "story/**"]

# Least privilege: every job reads the repo and nothing more.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes have no head_ref, so each run gets its own group
# (the run ID) and every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The Compose plugin every job that runs docker compose installs: the same version and SHA-256 as the AWS instance
# (infra/terraform/modules/compute/main.tf, compose_version and compose_sha256); change them together. The runner
# image's preinstalled Compose is older and rejects the gateway's service:spa build context (fixed in v5.6.0).
env:
  COMPOSE_VERSION: 5.6.1
  COMPOSE_SHA256: 47737f4236e6d3ccea7291995203f8f018058783b4c3a9469119811a0b5db8c0

jobs:
  # Whether a push changes anything but docs: scripts/ci-changes.sh sets an output that each heavy job's if: reads;
  # floor-guard always runs. A story/** push is judged on the whole story since its fork point with main, a main push
  # on its own commits, and a doubt runs everything (the script's header has the rules).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # fetch-depth 0 fetches every branch's whole history: the push's before commit, and origin/main for a story's
      # fork point (actions/checkout README).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The push event's before and after commits (GitHub, "Events that trigger workflows", push) reach the script only
      # through env.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          result=$(scripts/ci-changes.sh "$EVENT" "$REF" "$BEFORE" "$AFTER")
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      # As in the platform job: the architecture tests render docker-compose.yml with docker compose config, and the
      # runner's own Compose is older and refuses the gateway's service:spa build context.
      - name: Install Compose
        run: |
          plugins="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$plugins"
          curl -fsSL --max-time 300 -o "$RUNNER_TEMP/docker-compose" \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $RUNNER_TEMP/docker-compose" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/docker-compose" "$plugins/docker-compose"
          docker compose version
          if [ "$(docker compose version --short)" != "$COMPOSE_VERSION" ]; then
            echo "::error::docker compose is not v$COMPOSE_VERSION"
            exit 1
          fi

      # setup-dotnet's cache input needs packages.lock.json, which the repo does not have, so the NuGet global-packages
      # folder (~/.nuget/packages on Linux) is cached, keyed on the files that decide what restore downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/.config/dotnet-tools.json') }}

      - run: dotnet restore DisputeDesk.slnx

      # Warnings are errors through Directory.Build.props (TreatWarningsAsErrors), so CI and local builds agree.
      - run: dotnet build DisputeDesk.slnx --no-restore

      # The build regenerates openapi.json. Any difference from the committed file is contract drift.
      # The path is relative to the working directory (backend/).
      - name: OpenAPI drift
        run: git diff --exit-code -- openapi.json

      # IDE0003, IDE0049 and the var rules (IDE0007, IDE0008) never run in `dotnet build`; this is where they are enforced.
      - name: Code style
        run: dotnet format style DisputeDesk.slnx --verify-no-changes --no-restore

      # The build enforces indentation and spacing (IDE0055); the file-level .editorconfig rules
      # (final newline, line endings, charset) are only checked here.
      - name: Whitespace
        run: dotnet format whitespace DisputeDesk.slnx --verify-no-changes --no-restore

      # dotnet-ef is pinned in .config/dotnet-tools.json. Fails when an entity or configuration changed without a
      # migration. With no migrations yet it passes on the empty model and fails as soon as one is mapped.
      - name: EF model drift
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --no-build \
            --project src/DisputeDesk.Infrastructure --startup-project src/DisputeDesk.Api

      # Integration tests start Postgres with Testcontainers on the runner's Docker.
      - run: dotnet test --solution DisputeDesk.slnx --no-build

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Node version as local development and the SPA image's build stage (frontend/Dockerfile).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Production dependencies only (what ships in the gateway image); fails on a High or Critical advisory.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - name: Formatting
        run: npm run format

      - run: npm test

      # Orval regenerates the client from backend/openapi.json. Any difference from the committed files, new files
      # included, is drift.
      - name: Orval drift
        run: |
          npm run generate
          changes=$(git status --porcelain -- src/api/generated)
          if [[ -n "$changes" ]]; then
            echo "::error::src/api/generated does not match backend/openapi.json; run npm run generate and commit."
            printf '%s\n' "$changes"
            exit 1
          fi

  platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # The Infra tests step's GatewayTests build the SPA image twice (with and without browser telemetry) and a gateway on each.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker, "Install the plugin manually", for the active user: the CLI searches ~/.docker/cli-plugins before the
      # system plugin directories, so this plugin shadows the preinstalled one.
      - name: Install Compose
        run: |
          plugins="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$plugins"
          curl -fsSL --max-time 300 -o "$RUNNER_TEMP/docker-compose" \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $RUNNER_TEMP/docker-compose" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/docker-compose" "$plugins/docker-compose"
          docker compose version
          if [ "$(docker compose version --short)" != "$COMPOSE_VERSION" ]; then
            echo "::error::docker compose is not v$COMPOSE_VERSION"
            exit 1
          fi

      - name: Compose file is valid
        run: docker compose config --quiet

      # Story 7.4, offline with dummy inputs: the AWS override's render (every input required, nothing local left, the
      # instance's memory budget) and the collector config, validated by the pinned collector image.
      - name: AWS Compose override
        run: infra/aws/check-compose.sh

      # Story 7.5: the instance's deploy script with aws, curl, docker, iptables and systemctl stubbed.
      - name: AWS deploy script
        run: infra/aws/deploy.test.sh

      # Story 7.17: the unchanged deploy script's verify-full connection and database init against a throwaway
      # PostgreSQL 18 with TLS and a non-superuser master, on an internal Docker network.
      - name: RDS database init
        run: infra/aws/rds-init.test.sh

      # Story 2.6. The expected values are DESIGN.md's (Theme file and hosted-login theming), written here rather than
      # re-read from tokens.css, so a changed token fails until DESIGN.md and this list agree. Case is ignored.
      - name: Hosted-login label policy is generated from tokens.css
        run: |
          body=$(infra/zitadel/provision/label-policy.sh frontend/src/theme/tokens.css)
          echo "$body"
          expected='{"primaryColor":"#2B57C9","backgroundColor":"#F4F5F7","warnColor":"#B42318","fontColor":"#1E2430",
            "primaryColorDark":"#8CAAF7","backgroundColorDark":"#12171E","warnColorDark":"#FF8A7E","fontColorDark":"#EEF1F5",
            "themeMode":"THEME_MODE_AUTO"}'
          jq -e --argjson expected "$expected" \
            'map_values(ascii_downcase) == ($expected | map_values(ascii_downcase))' <<< "$body"

      # Story 2.6. Zitadel checks the brand files' bytes when provision.sh uploads them (the type from the bytes, at most
      # 512 KiB; the upload fails on HTTP 400 or above). No upload reads tokens.css's wordmark names, so they are
      # checked here.
      - name: tokens.css names both wordmarks and loads neither
        run: |
          for f in wordmark.png wordmark-dark.png; do
            grep -qF "$f" frontend/src/theme/tokens.css || { echo "::error::tokens.css does not name $f"; exit 1; }
          done
          ! grep -qE 'url\([^)]*wordmark' frontend/src/theme/tokens.css || { echo "::error::tokens.css loads a wordmark"; exit 1; }
          echo "ok  tokens.css names both wordmarks and loads neither"

      # ad-011: the tests of infra/'s own files: the provisioner, the gateway templates, and both gateway images on a
      # throwaway Docker network (GatewayTests, stories 7.4 and 7.12). infra/tests/global.json pins the same SDK as the
      # backend job and selects Microsoft.Testing.Platform; dotnet reads it from the working directory.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: infra/tests/global.json

      - name: Infra tests
        working-directory: infra/tests
        run: dotnet test --project DisputeDesk.PlatformTests

      # As in the backend job: the IDE-only style rules never run in `dotnet build`; this is where they are enforced.
      - name: Infra tests code style
        working-directory: infra/tests
        run: dotnet format style DisputeDesk.PlatformTests --verify-no-changes --no-restore

      # The file-level .editorconfig rules (final newline, line endings, charset) are only checked here.
      - name: Infra tests whitespace
        working-directory: infra/tests
        run: dotnet format whitespace DisputeDesk.PlatformTests --verify-no-changes

  # Story 7.5 (AD-28): the AWS dev environment's Terraform, checked with no AWS credentials and no AWS call. Plans and
  # applies run only from the maintainer's machine (infra/terraform/README.md); here every test plans against mocked
  # providers.
  terraform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Formatting
        run: terraform fmt -check -recursive -diff infra/terraform

      # -backend=false: no state bucket is read. The providers come from the committed lock files.
      - name: Validate and test (mocked plans)
        run: |
          for root in infra/terraform/bootstrap infra/terraform/envs/dev; do
            echo "== $root"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            terraform -chdir="$root" test
          done

      # Story 7.16: every IAM action and condition key in the policies exists in AWS's public service reference, fetched
      # over HTTPS with no credentials (no AWS API call). The step timeout bounds the whole run, retries included.
      - name: IAM names exist in AWS's service reference
        timeout-minutes: 5
        run: infra/terraform/iam-names.test.sh

      # What a plan cannot show, or the dev environment rules out (AD-28): prevent_destroy, deletion protection turned
      # on, a NAT gateway, a load balancer, an IAM user or access key.
      - name: Nothing that blocks destroy or that AD-28 rules out
        run: |
          if grep -rnE 'prevent_destroy|deletion_protection[[:space:]]*=[[:space:]]*true|resource "aws_(nat_gateway|lb|alb|elb|iam_user|iam_access_key)"' \
            infra/terraform --include='*.tf'; then
            echo "::error::infra/terraform holds one of the lines above."
            exit 1
          fi
          echo "None found."

      # The instance's rules are inline in its security group, where the compute test reads them; a standalone rule
      # resource would add to that group unseen. Only the database's one ingress rule is standalone.
      - name: Standalone security-group rules only in the database module
        run: |
          if grep -rnE 'resource "aws_(security_group_rule|vpc_security_group_(ingress|egress)_rule)"' \
            infra/terraform --include='*.tf' | grep -v '^infra/terraform/modules/database/main\.tf:'; then
            echo "::error::A standalone security-group rule outside infra/terraform/modules/database/main.tf."
            exit 1
          fi
          echo "None outside the database module."

  floor-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Downloaded from their GitHub releases and checked against a SHA-256 pinned here, as security.yml installs Trivy.
    # actionlint's pin is its line in the release's actionlint_<version>_checksums.txt; shellcheck publishes no checksum
    # file, so its pin is GitHub's digest of the release asset. Change a version and its pin together.
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/floor-guard.sh

      # The flow scripts' own tests, on scratch repositories with stubs: no network, no Docker.
      - run: scripts/ci-changes.test.sh
      - run: scripts/run-breaks.test.sh

      - name: Install actionlint
        run: |
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # $GITHUB_PATH entries come before the runner's PATH, so this shellcheck, not the runner image's, is the one both
      # lint steps run.
      - name: Install shellcheck
        run: |
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components 1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # actionlint runs the shellcheck on PATH over every run: block too (actionlint, docs/checks.md). Any finding fails.
      - name: actionlint
        run: |
          shellcheck --version
          actionlint .github/workflows/*.yml

      # Every tracked shell script. The :(glob) magic lets ** match no directory as well, so infra/smoke.sh is included
      # (gitglossary, pathspec). scripts/lane-runner.zsh is not linted: shellcheck does not support zsh.
      - name: shellcheck
        run: git ls-files -z ':(glob)infra/**/*.sh' 'scripts/*.sh' | xargs -0 shellcheck

      # Same rule as the pre-commit hook: whole-word, case-insensitive, one term per line, # comments allowed.
      # Only file:line is printed, never the matching text, so the terms stay out of the log.
      - name: Forbidden terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          terms="$RUNNER_TEMP/forbidden-terms"
          printf '%s\n' "$FORBIDDEN_TERMS" | tr -d '\r' | grep -v '^[[:space:]]*#' | sed '/^[[:space:]]*$/d' > "$terms" || true
          if [[ ! -s "$terms" ]]; then
            echo "::notice::The FORBIDDEN_TERMS secret is not set; the forbidden-terms check was skipped."
            exit 0
          fi
          matches=$(git grep -n -I -i -w -F -f "$terms") && status=0 || status=$?
          rm -f "$terms" # hosted runners are discarded, but a self-hosted runner would keep the terms on disk

          if [[ $status -eq 0 ]]; then
            echo "::error::Forbidden terms found (matching text withheld):"
            printf '%s\n' "$matches" | cut -d: -f1,2
            exit 1
          elif [[ $status -gt 1 ]]; then
            echo "::error::git grep failed (exit $status)."
            exit 1
          fi
          echo "No forbidden terms."

  # Story 7.3 (AD-32). The runner's fresh checkout and Docker daemon make the stack fresh, so customer D starts
  # unlinked (AD-30). Only the journeys run here; the regression project is not run in CI.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker, "Install the plugin manually", for the active user: the CLI searches ~/.docker/cli-plugins before the
      # system plugin directories, so this plugin shadows the preinstalled one.
      - name: Install Compose
        run: |
          plugins="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$plugins"
          curl -fsSL --max-time 300 -o "$RUNNER_TEMP/docker-compose" \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $RUNNER_TEMP/docker-compose" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/docker-compose" "$plugins/docker-compose"
          docker compose version
          if [ "$(docker compose version --short)" != "$COMPOSE_VERSION" ]; then
            echo "::error::docker compose is not v$COMPOSE_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci
        working-directory: e2e

      # The e2e lint fails on any timed wait (story 8.6).
      - run: npm run lint
        working-directory: e2e

      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      # --wait fails on a service that exits or turns unhealthy, and at the 600-second limit.
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 600

      # forbidOnly fails a committed test.only on CI; retries stay 0.
      - run: npm run journeys
        working-directory: e2e

      # Scope: an unauthenticated, passive scan of what the spider reaches from the gateway origin; the signed-in
      # screens are covered by the journeys above and per-story QA. ZAP's exit status is the gate (1 a FAIL, 2 a WARN,
      # 3 an incomplete scan): every alert not marked IGNORE, with its reason, in .zap/rules.tsv fails the job.
      # ZAP writes its plan into /zap/wrk as its own user, so it gets a writable copy rather than the checkout.
      - name: ZAP baseline
        run: |
          mkdir "$RUNNER_TEMP/zap"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap/"
          chmod a+rwx "$RUNNER_TEMP/zap"
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv -m 2 -T 10

      # error-context.md is Playwright's accessibility snapshot of the page a failed test was on (synthetic data only).
      - name: Stack diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
          find e2e/test-results -name error-context.md -print -exec cat {} \; 2>/dev/null || true

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Story 7.3 (AD-32): the only job that can write packages, on main only and only after the jobs in its needs pass;
  # terraform and the OIDC subject check (oidc-token, oidc-subject) are not among them (story 7.16). On a docs-only
  # push its needed jobs are skipped, and a job whose needs were skipped is skipped too, so nothing is published.
  # Each image is built, scanned and only then pushed, so the pushed bytes are the scanned bytes.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, platform, floor-guard, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      # The same Trivy version and SHA-256 pin as security.yml; change both together.
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      TRIVY_NO_PROGRESS: "true" # no download progress bars in the log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Each image is tagged sha-<the first 12 characters of the commit>, never latest. A failed build, scan or push
      # stops the step before the next image.
      - name: Build, scan and push the five images
        run: |
          publish(){ # name context [options passed on to docker build]
            image="ghcr.io/njabulozmnisi/disputedesk-$1:sha-${GITHUB_SHA::12}"
            docker build -t "$image" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "${@:3}" "$2"
            trivy image --image-src docker --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 "$image"
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            echo "| $1 | \`$digest\` | \`$revision\` |" >> "$GITHUB_STEP_SUMMARY"
          }
          printf '| Image | Digest | Revision |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          # api and worker are the -local targets: they carry the probe Compose's health checks call (P57).
          publish api          backend --target api-local
          publish worker       backend --target worker-local
          publish core-banking backend --target core-banking
          # The gateway takes the built SPA files from the SPA image through the named context spa (ad-011). The SPA
          # image is never pushed: its files ship inside the gateway, and the gateway's scan covers them. The AWS
          # gateway takes in no browser telemetry (AD-29), so the published UI sends none. docker-image:// of this local,
          # never-pushed tag works because the default docker driver reads the daemon's image store; a docker-container
          # builder (for example from setup-buildx-action) would try a registry pull instead.
          docker build -t disputedesk-spa:publish --build-arg BROWSER_TELEMETRY=off frontend
          publish gateway      infra/nginx --build-context spa=docker-image://disputedesk-spa:publish
          publish provision    infra/zitadel/provision

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Story 7.15 (AD-28): the deploy role trusts GitHub's immutable subject. On every push to main, oidc-token reads the
  # subject GitHub issues to this repository and oidc-subject checks the deploy-role module builds the same one. The
  # token is for a non-STS audience, so STS refuses it; neither job holds an AWS credential or gates publish.
  oidc-token:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only this job may mint a token, and it runs no checkout and no action (OWASP CICD-SEC-5).
    permissions:
      id-token: write
    outputs:
      subject: ${{ steps.token.outputs.subject }}
    steps:
      # The manual token request (GitHub, "OpenID Connect reference"). The token stays in shell variables only, is
      # masked before anything else is printed, and only its sub is handed on.
      - id: token
        name: Request a token and read its subject
        shell: bash
        env:
          AUDIENCE: disputedesk-oidc-subject-check
        run: |
          jq --version
          response=$(curl -sS --fail --max-time 10 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          token=$(printf '%s' "$response" | jq -r '.value' 2>/dev/null) || token=""
          if [[ -z "$token" || "$token" == null ]]; then
            echo "::error::The token request returned no token."
            exit 1
          fi
          echo "::add-mask::$token"

          # The payload only, not verified (RFC 7519, section 3): this check reads the claims; STS verifies tokens.
          # base64url (RFC 7515, section 2) becomes base64 for @base64d. jq's errors are discarded: they quote input.
          claims=$(printf '%s' "$token" |
            jq -R -c 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | {aud, sub}' 2>/dev/null) ||
            claims=""
          if [[ -z "$claims" ]]; then
            echo "::error::The token's payload is not a base64url-encoded JSON object."
            exit 1
          fi
          aud=$(printf '%s' "$claims" | jq -r '.aud')
          sub=$(printf '%s' "$claims" | jq -r '.sub')
          if [[ "$aud" != "$AUDIENCE" ]]; then
            echo "::error::The token's aud is not $AUDIENCE."
            exit 1
          fi
          if [[ -z "$sub" || "$sub" == null ]]; then
            echo "::error::The token has no sub."
            exit 1
          fi
          echo "sub: $sub"
          echo "aud: $aud"
          echo "subject=$sub" >> "$GITHUB_OUTPUT"

  oidc-subject:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: oidc-token
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      # The repository and its IDs from the github context (GitHub, "Contexts reference"), and the token's sub, reach
      # Terraform only as -var values through env. A failed assertion prints both subjects.
      - name: The deploy role trusts the subject GitHub issued
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_SUBJECT: ${{ needs.oidc-token.outputs.subject }}
        run: |
          terraform -chdir=infra/terraform/envs/dev init -backend=false -input=false -lockfile=readonly \
            -test-directory=tests-oidc
          terraform -chdir=infra/terraform/envs/dev test -test-directory=tests-oidc \
            -var "github_repository=$REPOSITORY" \
            -var "github_repository_owner_id=$REPOSITORY_OWNER_ID" \
            -var "github_repository_id=$REPOSITORY_ID" \
            -var "expected_subject=$EXPECTED_SUBJECT"

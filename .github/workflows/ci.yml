name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job reads the repo and nothing more.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes have no head_ref, so each run gets its own group
# (the run ID) and every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - run: dotnet restore DisputeDesk.slnx

      # Warnings are errors through Directory.Build.props (TreatWarningsAsErrors), so CI and local builds agree.
      - run: dotnet build DisputeDesk.slnx --no-restore

      # The build regenerates openapi.json. Any difference from the committed file is contract drift.
      # The path is relative to the working directory (backend/).
      - name: OpenAPI drift
        run: git diff --exit-code -- openapi.json

      # IDE0003, IDE0049 and the var rules (IDE0007, IDE0008) never run in `dotnet build`; this is where they are enforced.
      - name: Code style
        run: dotnet format style DisputeDesk.slnx --verify-no-changes --no-restore

      # The build enforces indentation and spacing (IDE0055); the file-level .editorconfig rules
      # (final newline, line endings, charset) are only checked here.
      - name: Whitespace
        run: dotnet format whitespace DisputeDesk.slnx --verify-no-changes --no-restore

      # dotnet-ef is pinned in .config/dotnet-tools.json. Fails when an entity or configuration changed without a
      # migration. With no migrations yet it passes on the empty model and fails as soon as one is mapped.
      - name: EF model drift
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --no-build \
            --project src/DisputeDesk.Infrastructure --startup-project src/DisputeDesk.Api

      # Integration tests start Postgres with Testcontainers on the runner's Docker.
      - run: dotnet test --solution DisputeDesk.slnx --no-build

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Node version as local development and the gateway image's build stage.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      # Production dependencies only (what ships in the gateway image); fails on a High or Critical advisory.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - name: Formatting
        run: npm run format

      - run: npm test

      # Orval regenerates the client from backend/openapi.json. Any difference from the committed files, new files
      # included, is drift.
      - name: Orval drift
        run: |
          npm run generate
          changes=$(git status --porcelain -- src/api/generated)
          if [[ -n "$changes" ]]; then
            echo "::error::src/api/generated does not match backend/openapi.json; run npm run generate and commit."
            printf '%s\n' "$changes"
            exit 1
          fi

  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose file is valid
        run: docker compose config --quiet

      # Story 2.6. The expected values are DESIGN.md's (Theme file and hosted-login theming), written here rather than
      # re-read from tokens.css, so a changed token fails until DESIGN.md and this list agree. Case is ignored.
      - name: Hosted-login label policy is generated from tokens.css
        run: |
          body=$(infra/zitadel/provision/label-policy.sh frontend/src/theme/tokens.css)
          echo "$body"
          expected='{"primaryColor":"#2B57C9","backgroundColor":"#F4F5F7","warnColor":"#B42318","fontColor":"#1E2430",
            "primaryColorDark":"#8CAAF7","backgroundColorDark":"#12171E","warnColorDark":"#FF8A7E","fontColorDark":"#EEF1F5",
            "themeMode":"THEME_MODE_AUTO"}'
          jq -e --argjson expected "$expected" \
            'map_values(ascii_downcase) == ($expected | map_values(ascii_downcase))' <<< "$body"

      # Each bound of the generator's input exits non-zero naming the token, before any API call.
      - name: Label policy generator rejects tokens outside its bounds
        run: |
          rejects(){ # description sed-script token
            sed -E "$2" frontend/src/theme/tokens.css > "$RUNNER_TEMP/tokens.css"
            if err=$(infra/zitadel/provision/label-policy.sh "$RUNNER_TEMP/tokens.css" 2>&1 >/dev/null); then
              echo "::error::accepted $1"; exit 1
            fi
            grep -qF -- "$3" <<< "$err" || { echo "::error::$1: the error does not name $3: $err"; exit 1; }
            echo "ok  $1: $err"
          }
          rejects "a named colour"            's/--primary: #2b57c9;/--primary: blue;/'                       --primary
          rejects "a three-digit colour"      's/--background: #f4f5f7;/--background: #fff;/'                --background
          rejects "an eight-digit colour"     's/--destructive: #b42318;/--destructive: #b42318ff;/'         --destructive
          rejects "a token declared twice"    's/--primary: #2b57c9;/--primary: #2b57c9; --primary: #2b57c9;/' --primary
          rejects "a twice-declared token with a space before its colon" \
            's/--primary: #2b57c9;/--primary: #2b57c9; --primary : #000000;/' --primary
          rejects "a twice-declared token with a newline before its colon" 's/--primary: #2b57c9;/--primary: #2b57c9; --primary\
          : #000000;/' --primary
          rejects "a value that repeats the token name" 's/--primary: #2b57c9;/--primary: --primary: #2b57c9;/' --primary
          rejects "only a prefixed token"     '/--primary: #2b57c9;/d'                                       --primary
          rejects "a dark token missing"      '/--foreground: #eef1f5;/d'                                    --foreground
          rejects "only a commented-out token" 's|--primary: #2b57c9;|/* --primary: #2b57c9; */|'             --primary
          rejects "only a multi-line comment" 's|--primary: #2b57c9;|/*\
          --primary: #2b57c9;\
          */|' --primary

      # The files provisioning uploads: signatures from the W3C PNG (section 5.2) and WOFF 2.0 (section 3)
      # specifications, and Zitadel's 512 KiB limit per asset.
      - name: Hosted-login brand files
        run: |
          brand(){ # file signature-hex
            size=$(wc -c < "$1")
            [ "$size" -le 524288 ] || { echo "::error::$1 is $size bytes, over 512 KiB"; exit 1; }
            [ "$(od -An -tx1 -N $(( ${#2} / 2 )) "$1" | tr -d ' \n')" = "$2" ] || { echo "::error::$1 is not the expected type"; exit 1; }
            echo "ok  $1 ($size bytes)"
          }
          brand frontend/src/theme/wordmark.png                         89504e470d0a1a0a
          brand frontend/src/theme/wordmark-dark.png                    89504e470d0a1a0a
          brand frontend/src/theme/fonts/nunito-sans-latin-400-normal.woff2 774f4632
          for f in wordmark.png wordmark-dark.png; do
            grep -qF "$f" frontend/src/theme/tokens.css || { echo "::error::tokens.css does not name $f"; exit 1; }
          done
          ! grep -qE 'url\([^)]*wordmark' frontend/src/theme/tokens.css || { echo "::error::tokens.css loads a wordmark"; exit 1; }
          echo "ok  tokens.css names both wordmarks and loads neither"

  floor-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/floor-guard.sh

      # Same rule as the pre-commit hook: whole-word, case-insensitive, one term per line, # comments allowed.
      # Only file:line is printed, never the matching text, so the terms stay out of the log.
      - name: Forbidden terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          terms="$RUNNER_TEMP/forbidden-terms"
          printf '%s\n' "$FORBIDDEN_TERMS" | tr -d '\r' | grep -v '^[[:space:]]*#' | sed '/^[[:space:]]*$/d' > "$terms" || true
          if [[ ! -s "$terms" ]]; then
            echo "::notice::The FORBIDDEN_TERMS secret is not set; the forbidden-terms check was skipped."
            exit 0
          fi
          matches=$(git grep -n -I -i -w -F -f "$terms") && status=0 || status=$?
          rm -f "$terms" # hosted runners are discarded, but a self-hosted runner would keep the terms on disk

          if [[ $status -eq 0 ]]; then
            echo "::error::Forbidden terms found (matching text withheld):"
            printf '%s\n' "$matches" | cut -d: -f1,2
            exit 1
          elif [[ $status -gt 1 ]]; then
            echo "::error::git grep failed (exit $status)."
            exit 1
          fi
          echo "No forbidden terms."

  # Story 7.3 (AD-32). The runner's fresh checkout and Docker daemon make the stack fresh, so customer D starts
  # unlinked (AD-30). Only the journeys run here; the regression project is not run in CI.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci
        working-directory: e2e

      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      # --wait fails on a service that exits or turns unhealthy, and at the 600-second limit.
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 600

      # forbidOnly fails a committed test.only on CI; retries stay 0.
      - run: npm run journeys
        working-directory: e2e

      # Scope: an unauthenticated, passive scan of what the spider reaches from the gateway origin; the signed-in
      # screens are covered by the journeys above and per-story QA. ZAP's exit status is the gate (1 a FAIL, 2 a WARN,
      # 3 an incomplete scan): every alert not marked IGNORE, with its reason, in .zap/rules.tsv fails the job.
      # ZAP writes its plan into /zap/wrk as its own user, so it gets a writable copy rather than the checkout.
      - name: ZAP baseline
        run: |
          mkdir "$RUNNER_TEMP/zap"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap/"
          chmod a+rwx "$RUNNER_TEMP/zap"
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv -m 2 -T 10

      - name: Stack diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Story 7.3 (AD-32): the only job that can write packages, on main only and only after every other CI job passes.
  # Each image is built, scanned and only then pushed, so the pushed bytes are the scanned bytes.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, platform, floor-guard, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      # The same Trivy version and SHA-256 pin as security.yml; change both together.
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      TRIVY_NO_PROGRESS: "true" # no download progress bars in the log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Each image is tagged sha-<the first 12 characters of the commit>, never latest. A failed build, scan or push
      # stops the step before the next image.
      - name: Build, scan and push the five images
        run: |
          publish(){ # name context [options passed on to docker build]
            image="ghcr.io/njabulozmnisi/disputedesk-$1:sha-${GITHUB_SHA::12}"
            docker build -t "$image" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "${@:3}" "$2"
            trivy image --image-src docker --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 "$image"
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            echo "| $1 | \`$digest\` | \`$revision\` |" >> "$GITHUB_STEP_SUMMARY"
          }
          printf '| Image | Digest | Revision |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          # api and worker are the -local targets: they carry the probe Compose's health checks call (P57).
          publish api          backend --target api-local
          publish worker       backend --target worker-local
          publish core-banking backend --target core-banking
          publish gateway      .       -f infra/nginx/Dockerfile
          publish provision    infra/zitadel/provision

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

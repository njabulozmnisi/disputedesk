# Triaged Trivy findings (NFR-SEC-8: a High or Critical finding fails the build unless triaged here).
# Each entry is scoped to one path and says why it is accepted; a vulnerability entry also expires, so it is decided
# again (Trivy, "Filtering", .trivyignore.yaml, read with --ignorefile).
vulnerabilities:
  - id: CVE-2026-116587
    paths:
      - "app/zitadel"
    expired_at: 2027-02-05
    statement: >-
      go-jose v4.1.4, compiled into the pinned Zitadel v4.20.0 binary of the disputedesk-zitadel image (denial of
      service, fixed in go-jose 4.1.6; Zitadel v4.20.1 still pins 4.1.4). Likely reachable: Zitadel parses JOSE
      objects from callers (signed tokens and client assertions). Accepted until a Zitadel release ships the fixed
      go-jose; docs/production-path.md records it. Human decision 2026-11-05.
  - id: CVE-2026-78661
    paths:
      - "app/zitadel"
    expired_at: 2027-02-05
    statement: >-
      golang.org/x/net v0.61.0, compiled into the pinned Zitadel v4.20.0 binary of the disputedesk-zitadel image
      (denial of service in x/net/html, fixed in 0.62.0; Zitadel v4.20.1 and its main branch still pin 0.61.0).
      Accepted until a Zitadel release ships the fixed x/net; docs/production-path.md P78 records it. Human decision
      2026-11-07.
misconfigurations:
  - id: AWS-0011
    paths:
      - "infra/terraform/modules/edge/main.tf"
    statement: >-
      No WAF on the AWS demo's CloudFront distributions: accepted by the human decision on 7.4 and 7.5 pre-build security
      (docs/production-path.md P52); the demo holds only synthetic data on a dedicated account.
  - id: AWS-0104
    paths:
      - "infra/terraform/modules/compute/main.tf"
    statement: >-
      HTTPS (443 only) out to any address: the instance has no NAT gateway, proxy or VPC endpoints and must reach GHCR,
      SSM, CloudWatch, X-Ray, KMS and CloudFront; PostgreSQL out is limited to the database's group. Human decision
      2026-10-31; production path P62.
  - id: AWS-0132
    paths:
      - "infra/terraform/bootstrap/main.tf"
    statement: >-
      The state bucket uses S3-managed encryption (default encryption, story 7.5 criterion 1) with public access blocked,
      TLS required and versioning on; a customer-managed KMS key is production path P63. Human decision 2026-10-31.

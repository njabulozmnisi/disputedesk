name: Install Compose
description: Installs the pinned Docker Compose plugin for the runner's user, checked against its SHA-256 (install.sh).
runs:
  using: composite
  steps:
    # The script sits beside this file so shellcheck lints it (actionlint does not lint a composite action's run:).
    - run: '"$GITHUB_ACTION_PATH/install.sh"'
      shell: bash
